[package]
name = "iced_vello_canvas"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A Vello-backed canvas widget for Iced"
repository = "https://github.com/aneeshthunga26/iced_vello_canvas"
readme = "README.md"
publish = false
keywords = ["iced", "canvas", "vello", "graphics", "wgpu"]
categories = ["gui", "rendering::graphics-api"]

[features]
default = ["gpu", "x11"]
gpu = ["dep:glifo", "dep:lru", "dep:vello_common", "dep:vello_gpu"]
x11 = ["iced/x11"]
wayland = ["iced/wayland"]

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "wgpu", "thread-pool"] }
iced_wgpu = "=0.14.0"
lru = { version = "0.16", default-features = false, optional = true }
vello = { version = "=0.7.0", default-features = false, features = ["wgpu"] }
glifo = { version = "=0.5.0", default-features = false, features = ["std"], optional = true }
vello_common = { version = "=0.4.0", default-features = false, features = ["std"], optional = true }
vello_gpu = { version = "=0.4.0", default-features = false, features = ["wgpu", "text", "full_image_support"], optional = true }

[dev-dependencies]
iced = { version = "0.14.0", default-features = false, features = ["fira-sans"] }
pollster = "0.4"

[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
vello_gpu = { path = "vendor/vello_gpu" }

[[bench]]
name = "curves"
harness = false
required-features = ["gpu"]

[lints.rustdoc]
broken_intra_doc_links = "deny"
